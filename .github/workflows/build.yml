name: Build Vertical Canvas Lite + Installer (OBS 27.2.4)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

env:
  OBS_TAG: "27.2.4"
  QT_VERSION: "5.15.2"

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout do plugin
        uses: actions/checkout@v4

      - name: Checkout do OBS 27.2.4
        uses: actions/checkout@v4
        with:
          repository: obsproject/obs-studio
          ref: ${{ env.OBS_TAG }}
          path: obs-studio
          submodules: recursive

      - name: Instalar Qt 5.15.2
        uses: jurplel/install-qt-action@v3
        with:
          version: "5.15.2"
          host: windows
          target: desktop
          arch: win64_msvc2019_64
          dir: ${{ github.workspace }}/qt
          cache: true

      - name: Baixar dependências do OBS 27.2.4
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = "https://github.com/obsproject/obs-deps/releases/download/win-2022-01-31/windows-deps-2022-01-31.zip"
          Invoke-WebRequest -Uri $url -OutFile deps.zip
          New-Item -ItemType Directory -Force deps | Out-Null
          Expand-Archive deps.zip -DestinationPath deps -Force
          if (-not (Test-Path "deps/win64")) {
            throw "A pasta deps/win64 não foi encontrada."
          }

      - name: Configurar OBS para gerar bibliotecas
        shell: pwsh
        run: |
          cmake -S obs-studio -B obs-studio/build64 -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_SYSTEM_VERSION=10.0.18363.657 `
            -DDepsPath="${{ github.workspace }}/deps/win64" `
            -DQTDIR="${{ github.workspace }}/qt/Qt/5.15.2/msvc2019_64" `
            -DENABLE_UI=ON -DENABLE_SCRIPTING=OFF -DBUILD_BROWSER=OFF `
            -DENABLE_PLUGINS=OFF -DDISABLE_UPDATE_MODULE=ON

      - name: Compilar bibliotecas do OBS
        shell: pwsh
        run: cmake --build obs-studio/build64 --config Release --target libobs obs-frontend-api

      - name: Configurar e compilar o plugin
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/qt/Qt/5.15.2/msvc2019_64" `
            -DOBS_SOURCE_DIR="${{ github.workspace }}/obs-studio" `
            -DOBS_BUILD_DIR="${{ github.workspace }}/obs-studio/build64" `
            -DOBS_CONFIG=Release
          cmake --build build --config Release
          if (-not (Test-Path 'build/Release/vertical-canvas-lite.dll')) { throw 'DLL não foi gerada.' }

      - name: Instalar Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Gerar instalador EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' installer/VerticalCanvasLite.iss
          if (-not (Test-Path 'dist/VerticalCanvasLite-Setup-x64.exe')) { throw 'Instalador EXE não foi gerado.' }

      - name: Publicar artefatos para download
        uses: actions/upload-artifact@v4
        with:
          name: VerticalCanvasLite-Windows-x64
          path: |
            build/Release/vertical-canvas-lite.dll
            dist/VerticalCanvasLite-Setup-x64.exe
          if-no-files-found: error
